<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Dukandar v5 Cloud</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA70ZubztEs82g5aABM5TW5t5Hb__D2sOI",
    authDomain: "pro-dukandar-2c4a0.firebaseapp.com",
    projectId: "pro-dukandar-2c4a0",
    storageBucket: "pro-dukandar-2c4a0.firebasestorage.app",
    messagingSenderId: "404988689088",
    appId: "1:404988689088:web:883ff97e7a4cf708cd0b25",
    measurementId: "G-QV2G4E5MT0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.db = db; // global

  // Owner: Vacancy Post Function
  window.postVacancy = async function() {
    const shop = document.getElementById('shopName').value;
    const pin = document.getElementById('pincode').value;
    const job = document.getElementById('jobRole').value;
    const salary = document.getElementById('salary').value;
    const phone = document.getElementById('phone').value;
    
    if(!shop || !pin) { alert('नाव आणि Pincode टाका'); return; }
    
    document.getElementById('postBtn').innerText = 'Posting...';
    try {
      await addDoc(collection(db, "vacancies"), {
        shopName: shop,
        pincode: pin.trim(),
        jobRole: job,
        salary: salary,
        phone: phone,
        createdAt: serverTimestamp()
      });
      alert('✅ Vacancy Cloud वर Post झाली! आता दुसऱ्या फोनवर दिसेल');
      document.getElementById('postBtn').innerText = 'Post Vacancy';
    } catch(e) { alert('Error: '+e.message); }
  }

  // Employee: Search Function - हाच तुमचा प्रॉब्लेम Solve करेल
  window.searchJobs = async function() {
    const pinSearch = document.getElementById('searchPin').value.trim();
    const resultDiv = document.getElementById('results');
    resultDiv.innerHTML = 'Searching Cloud वर...';
    
    const q = query(collection(db, "vacancies"), where("pincode", "==", pinSearch));
    const snapshot = await getDocs(q);
    
    if(snapshot.empty) {
      resultDiv.innerHTML = `<p style="color:red">या ${pinSearch} Pincode वर Vacancy नाही (Cloud वर पण नाही)</p>`;
      return;
    }
    
    let html = `<h3>${pinSearch} साठी ${snapshot.size} Vacancy सापडल्या:</h3>`;
    snapshot.forEach(doc => {
      const d = doc.data();
      html += `<div style="border:1px solid #ccc;padding:10px;margin:10px;border-radius:8px">
        <b>🏪 ${d.shopName}</b> - ${d.jobRole}<br>
        📍 Pincode: ${d.pincode} | 💰 ${d.salary}<br>
        📞 ${d.phone}
      </div>`;
    });
    resultDiv.innerHTML = html;
  }
</script>
</head>
<body style="font-family:Arial;padding:15px;max-width:500px;margin:auto">
  <h2 style="text-align:center;color:#0b57d0">Pro Dukandar v5 Cloud ☁️</h2>
  
  <div style="background:#e8f0fe;padding:15px;border-radius:10px;margin-bottom:20px">
    <h3>मालक - Vacancy टाका (Moraya)</h3>
    <input id="shopName" placeholder="दुकानाचे नाव - Moraya" style="width:100%;padding:8px;margin:5px 0"><br>
    <input id="pincode" placeholder="Pincode - 415523" value="415523" style="width:100%;padding:8px;margin:5px 0"><br>
    <input id="jobRole" placeholder="काम - सेल्समन" style="width:100%;padding:8px;margin:5px 0"><br>
    <input id="salary" placeholder="पगार - 12000" style="width:100%;padding:8px;margin:5px 0"><br>
    <input id="phone" placeholder="फोन नंबर" style="width:100%;padding:8px;margin:5px 0"><br>
    <button id="postBtn" onclick="postVacancy()" style="width:100%;padding:10px;background:#0b57d0;color:white;border:none;border-radius:5px">Cloud वर Post करा</button>
  </div>

  <div style="background:#fef7e0;padding:15px;border-radius:10px">
    <h3>कर्मचारी - नोकरी शोधा (Sneha)</h3>
    <input id="searchPin" placeholder="Pincode टाका - 415523" value="415523" style="width:100%;padding:8px;margin:5px 0"><br>
    <button onclick="searchJobs()" style="width:100%;padding:10px;background:green;color:white;border:none;border-radius:5px">Search करा</button>
    <div id="results" style="margin-top:15px"></div>
  </div>

  <p style="text-align:center;font-size:12px;margin-top:20px;color:gray">v5 Cloud | Project: pro-dukandar-2c4a0 | Firebase Live</p>
</body>
</html>
