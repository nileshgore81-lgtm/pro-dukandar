<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Dukandar - Professional App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans Devanagari', sans-serif}</style>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyA70ZubztEs82g5aABM5TW5t5Hb__D2sOI",
    authDomain: "pro-dukandar-2c4a0.firebaseapp.com",
    projectId: "pro-dukandar-2c4a0",
    storageBucket: "pro-dukandar-2c4a0.firebasestorage.app",
    messagingSenderId: "404988689088",
    appId: "1:404988689088:web:883ff97e7a4cf708cd0b25"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.postVacancy = async function() {
    const shop = document.getElementById('shopName').value.trim();
    const pin = document.getElementById('pincode').value.trim();
    const job = document.getElementById('jobRole').value.trim();
    const salary = document.getElementById('salary').value.trim();
    const phone = document.getElementById('phone').value.trim();
    if(!shop || !pin || !phone){ alert('दुकान, Pincode आणि फोन टाका'); return; }
    const btn = document.getElementById('postBtn');
    btn.innerText = '☁️ Posting...'; btn.disabled=true;
    try {
      await addDoc(collection(db, "vacancies"), { shopName: shop, pincode: pin, jobRole: job||'स्टाफ', salary: salary||'संपर्क', phone: phone, createdAt: serverTimestamp() });
      alert('✅ Vacancy Cloud वर Live झाली!');
      btn.innerText='✅ Post झाली!'; setTimeout(()=>{btn.innerText='Cloud वर Post करा ☁️'; btn.disabled=false;},1500);
    } catch(e){ alert(e.message); btn.disabled=false; }
  }
  window.searchJobs = async function() {
    const pinSearch = document.getElementById('searchPin').value.trim();
    const resultDiv = document.getElementById('results');
    resultDiv.innerHTML = 'Cloud वर शोधतोय...';
    const q = query(collection(db, "vacancies"), where("pincode", "==", pinSearch));
    const snapshot = await getDocs(q);
    if(snapshot.empty){ resultDiv.innerHTML = `<p class='text-red-600 text-center bg-red-50 p-3 rounded-xl'>${pinSearch} वर Vacancy नाही</p>`; return; }
    let html = `<h3 class='font-bold mb-2'>${pinSearch} साठी ${snapshot.size} Vacancy:</h3>`;
    snapshot.forEach(doc => {
      const d = doc.data();
      html += `<div class='bg-white border p-4 rounded-xl mb-3 shadow'><b class='text-blue-700'>🏪 ${d.shopName}</b> - ${d.jobRole}<br>📍 ${d.pincode} | 💰 ${d.salary}<br><a href='tel:${d.phone}' class='mt-2 block bg-green-600 text-white text-center py-2 rounded-lg'>📞 ${d.phone}</a></div>`;
    });
    resultDiv.innerHTML = html;
  }
</script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-orange-50 min-h-screen">
<header class="bg-white shadow p-3 sticky top-0"><div class="max-w-lg mx-auto flex justify-between"><h1 class="font-bold text-blue-700 text-xl">🛍️ Pro Dukandar</h1><span class="bg-blue-600 text-white text-xs px-3 py-1 rounded-full">v6 Cloud LIVE</span></div></header>
<main class="max-w-lg mx-auto p-4 space-y-5">
<div class="bg-white p-5 rounded-2xl shadow border"><h3 class="font-bold text-blue-700 mb-3">🏪 मालक - Vacancy टाका</h3><input id="shopName" placeholder="Moraya Enterprises" class="w-full p-3 border rounded-xl mb-2"><input id="pincode" value="415523" placeholder="Pincode" class="w-full p-3 border rounded-xl mb-2"><input id="jobRole" placeholder="Accountant" class="w-full p-3 border rounded-xl mb-2"><input id="salary" placeholder="15000" class="w-full p-3 border rounded-xl mb-2"><input id="phone" placeholder="फोन नंबर" class="w-full p-3 border rounded-xl mb-2"><button id="postBtn" onclick="postVacancy()" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl">Cloud वर Post करा ☁️</button></div>
<div class="bg-white p-5 rounded-2xl shadow border"><h3 class="font-bold text-green-700 mb-3">🔍 कर्मचारी - शोधा</h3><div class="flex gap-2"><input id="searchPin" value="415523" class="flex-1 p-3 border rounded-xl"><button onclick="searchJobs()" class="px-6 bg-green-600 text-white font-bold rounded-xl">Search</button></div><div id="results" class="mt-4"></div></div>
</main>
</body>
</html>
