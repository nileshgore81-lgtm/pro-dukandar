<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Dukandar v7.1 - Kharidi + Vikri + GST</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans Devanagari',sans-serif}</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyA70ZubztEs82g5aABM5TW5t5Hb__D2sOI",
  authDomain: "pro-dukandar-2c4a0.firebaseapp.com",
  projectId: "pro-dukandar-2c4a0",
  storageBucket: "pro-dukandar-2c4a0.firebasestorage.app",
  messagingSenderId: "404988689088",
  appId: "1:404988689088:web:883ff97e7a4cf708cd0b25"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let cart=[]; let productsCache=[];
window.addProduct = async function(){
  const name=document.getElementById('pName').value.trim();
  const buyPrice=parseFloat(document.getElementById('pBuyPrice').value)||0;
  const sellPrice=parseFloat(document.getElementById('pSellPrice').value)||0;
  const hsn=document.getElementById('pHsn').value.trim()||'0000';
  const gst=parseFloat(document.getElementById('pGst').value)||0;
  if(!name||!sellPrice){alert('नाव आणि विक्री किंमत टाका');return;}
  const btn=document.getElementById('addPBtn'); btn.innerText='Saving...';
  try{
    const profit=sellPrice-buyPrice;
    const profitPercent=buyPrice>0? (profit/buyPrice*100).toFixed(1):0;
    await addDoc(collection(db,'products'),{name,buyPrice,sellPrice,price:sellPrice,profit,profitPercent,hsn,gstPercent:gst,createdAt:serverTimestamp(),shopPin:document.getElementById('shopPinMain').value||'415523'});
    alert(`✅ Add झाला! खरेदी ₹${buyPrice} | विक्री ₹${sellPrice} | नफा ₹${profit}`);
    loadProducts();
  }catch(e){alert(e.message);} btn.innerText='Add Product (खरेदी+विक्री)';
}
window.loadProducts = async function(){
  const q=query(collection(db,'products'),orderBy('createdAt','desc'),limit(100));
  const snap=await getDocs(q); productsCache=[]; let html='';
  snap.forEach(d=>{ const p={id:d.id,...d.data()};
    productsCache.push(p);
    const profit=p.profit||0;
    html+=`<div class='flex justify-between bg-white p-3 rounded-xl border mb-2'><div><b>${p.name}</b> HSN ${p.hsn} GST ${p.gstPercent}%<br><span class='text-sm'><span class='bg-orange-100 px-2 rounded'>खरेदी ₹${p.buyPrice||0}</span> <span class='bg-green-100 px-2 rounded'>विक्री ₹${p.sellPrice}</span> <span class='bg-blue-100 px-2 rounded font-bold'>नफा ₹${profit}</span></span></div><button onclick='addToCart("${p.id}")' class='bg-blue-600 text-white px-3 py-1 rounded-lg'>+ Bill</button></div>`;
  });
  document.getElementById('productList').innerHTML=html||'Product नाही';
  let opt='<option value="">Product निवडा</option>'; productsCache.forEach(p=>{opt+=`<option value="${p.id}">${p.name} - खरेदी ₹${p.buyPrice||0} | विक्री ₹${p.sellPrice} (नफा ₹${p.profit||0})</option>`});
  document.getElementById('billProductSelect').innerHTML=opt;
}
window.addToCart=function(pid){ const p=productsCache.find(x=>x.id===pid); const ex=cart.find(c=>c.id===pid); if(ex) ex.qty++; else cart.push({...p,qty:1,billPrice:p.sellPrice}); renderCart(); }
window.addToCartFromSelect=function(){ const pid=document.getElementById('billProductSelect').value; if(pid) addToCart(pid); }
window.renderCart=function(){
  let totalBase=0,totalGst=0,totalBuy=0,totalProfit=0,html='';
  cart.forEach((c,i)=>{
    const buy=c.buyPrice||0; const sell=c.billPrice||c.sellPrice; const base=sell*c.qty; const gstAmt=base*c.gstPercent/100; const profit=(sell-buy)*c.qty;
    totalBase+=base; totalGst+=gstAmt; totalBuy+=buy*c.qty; totalProfit+=profit;
    html+=`<div class='flex justify-between bg-gray-50 p-2 rounded mb-1 text-sm'><span>${c.name} x${c.qty}<br><span class='text-xs'>खरेदी ₹${buy} नफा ₹${profit.toFixed(0)}</span></span><span>₹${base}+GST ₹${gstAmt.toFixed(2)}<br><button onclick='cart.splice(${i},1);renderCart()' class='text-red-600'>x</button></span></div>`;
  });
  document.getElementById('cartItems').innerHTML=html||'Cart रिकामा';
  document.getElementById('cartSummary').innerHTML=`<div class='bg-blue-50 p-3 rounded-xl mt-2 text-sm'><div class='flex justify-between'><span>खरेदी:</span><span>₹${totalBuy.toFixed(2)}</span></div><div class='flex justify-between'><span>विक्री Base:</span><b>₹${totalBase.toFixed(2)}</b></div><div class='flex justify-between text-green-700 font-bold'><span>नफा:</span><span>₹${totalProfit.toFixed(2)}</span></div><div class='flex justify-between font-bold border-t'><span>Grand:</span><span>₹${(totalBase+totalGst).toFixed(2)}</span></div></div>`;
}
window.createBill=async function(){
  if(cart.length==0){alert('Cart रिकामा');return;}
  let totalBase=0,totalGst=0,totalBuy=0,totalProfit=0;
  const items=cart.map(c=>{const buy=c.buyPrice||0; const sell=c.billPrice||c.sellPrice; const base=sell*c.qty; const gstAmt=base*c.gstPercent/100; const profit=(sell-buy)*c.qty; totalBase+=base; totalGst+=gstAmt; totalBuy+=buy*c.qty; totalProfit+=profit; return {name:c.name,hsn:c.hsn,buyPrice:buy,sellPrice:sell,qty:c.qty,gstPercent:c.gstPercent,base,gstAmt,profit,total:base+gstAmt};});
  const billData={customerName:document.getElementById('custName').value||'Cash',items,baseTotal:totalBase,totalBuy,totalProfit,totalGst,cgst:totalGst/2,sgst:totalGst/2,grandTotal:totalBase+totalGst,paymentMode:document.getElementById('payMode').value,createdAt:serverTimestamp(),shopPin:document.getElementById('shopPinMain').value};
  await addDoc(collection(db,'bills'),billData); alert(`Bill ₹${(totalBase+totalGst).toFixed(2)} नफा ₹${totalProfit.toFixed(2)}`); cart=[]; renderCart(); loadBills();
}
window.loadBills=async function(){
  const q=query(collection(db,'bills'),orderBy('createdAt','desc'),limit(30)); const snap=await getDocs(q); let html='',sumGst=0,sumTot=0,sumProfit=0;
  snap.forEach(d=>{const b=d.data(); sumGst+=b.totalGst||0; sumTot+=b.grandTotal||0; sumProfit+=b.totalProfit||0; html+=`<div class='bg-white p-3 rounded-xl border mb-2 text-sm'><b>${b.customerName}</b> Grand ₹${b.grandTotal?.toFixed(2)} नफा ₹${b.totalProfit?.toFixed(2)}</div>`;});
  document.getElementById('billsList').innerHTML=html||'Bill नाही';
  document.getElementById('gstReport').innerHTML=`<div class='bg-green-600 text-white p-4 rounded-2xl'><p>Sales ₹${sumTot.toFixed(2)} | Profit ₹${sumProfit.toFixed(2)} | GST ₹${sumGst.toFixed(2)}</p></div>`;
}
window.switchTab=function(tab){ document.querySelectorAll('.tabContent').forEach(el=>el.classList.add('hidden')); document.getElementById('tab-'+tab).classList.remove('hidden'); document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('bg-blue-600','text-white')); document.getElementById('btn-'+tab).classList.add('bg-blue-600','text-white'); if(tab==='products') loadProducts(); if(tab==='bills'||tab==='gst') loadBills(); }
window.addEventListener('load',()=>{loadProducts(); switchTab('products');});
</script>
</head>
<body class="bg-gray-100">
<header class="bg-white shadow sticky top-0 z-20">
  <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between"><h1 class="font-bold text-blue-700 text-xl">🛍️ Pro Dukandar v7.1</h1><span class="bg-green-600 text-white text-xs px-3 py-1 rounded-full">Kharidi+Vikri LIVE</span></div>
  <div class="max-w-5xl mx-auto px-2 pb-2 flex gap-2 overflow-x-auto">
    <button id="btn-products" onclick="switchTab('products')" class="tabBtn bg-blue-600 text-white px-4 py-2 rounded-full text-sm">📦 Products + Kharidi</button>
    <button id="btn-billing" onclick="switchTab('billing')" class="tabBtn bg-white border px-4 py-2 rounded-full text-sm">🧾 Billing</button>
    <button id="btn-bills" onclick="switchTab('bills')" class="tabBtn bg-white border px-4 py-2 rounded-full text-sm">📜 Bills</button>
    <button id="btn-gst" onclick="switchTab('gst')" class="tabBtn bg-white border px-4 py-2 rounded-full text-sm">📊 Report</button>
    <button id="btn-settings" onclick="switchTab('settings')" class="tabBtn bg-white border px-4 py-2 rounded-full text-sm">⚙️ Settings</button>
  </div>
</header>
<main class="max-w-5xl mx-auto p-4">
  <div id="tab-products" class="tabContent"><div class="bg-white p-5 rounded-2xl shadow mb-4 border-2 border-blue-100"><h3 class="font-bold mb-3">📦 Product - खरेदी + विक्री + GST</h3><div class="grid grid-cols-2 md:grid-cols-6 gap-2"><input id="pName" placeholder="साखर" class="p-3 border rounded-xl"><input id="pBuyPrice" placeholder="खरेदी 40" class="p-3 border-2 border-orange-300 rounded-xl bg-orange-50 font-bold" type="number"><input id="pSellPrice" placeholder="विक्री 50" class="p-3 border-2 border-green-300 rounded-xl bg-green-50 font-bold" type="number"><input id="pHsn" placeholder="HSN 1701" class="p-3 border rounded-xl"><select id="pGst" class="p-3 border rounded-xl"><option value="0">0%</option><option value="5" selected>5%</option><option value="12">12%</option><option value="18">18%</option><option value="28">28%</option></select><input id="pStock" placeholder="Stock" class="p-3 border rounded-xl"></div><button id="addPBtn" onclick="addProduct()" class="mt-3 w-full bg-blue-600 text-white py-3 rounded-xl font-bold">Add Product (खरेदी+विक्री) ☁️</button></div><div id="productList"></div></div>
  <div id="tab-billing" class="tabContent hidden"><div class="bg-white p-5 rounded-2xl shadow"><h3 class="font-bold mb-3">Billing - नफा + GST</h3><div class="flex gap-2 mb-3"><select id="billProductSelect" class="flex-1 p-3 border rounded-xl"></select><button onclick="addToCartFromSelect()" class="bg-blue-600 text-white px-4 rounded-xl">+ Add</button></div><input id="custName" placeholder="Customer" class="w-full p-3 border rounded-xl mb-2"><select id="payMode" class="w-full p-3 border rounded-xl mb-3"><option>Cash</option><option>UPI</option><option>उधार</option></select><div id="cartItems"></div><div id="cartSummary"></div><button id="billBtn" onclick="createBill()" class="mt-4 w-full bg-green-600 text-white py-3 rounded-xl font-bold">Bill बनवा</button></div></div>
  <div id="tab-bills" class="tabContent hidden"><div id="billsList"></div></div>
  <div id="tab-gst" class="tabContent hidden"><div id="gstReport"></div></div>
  <div id="tab-settings" class="tabContent hidden"><div class="bg-white p-5 rounded-2xl shadow"><h3 class="font-bold">Settings</h3><div class="grid grid-cols-3 gap-2 mt-2"><input id="shopNameMain" value="Moraya Enterprises" class="p-3 border rounded-xl"><input id="shopPinMain" value="415523" class="p-3 border rounded-xl"><input id="shopGstinMain" value="27ABCDE1234F1Z5" class="p-3 border rounded-xl"></div></div></div>
</main>
</body>
</html>
